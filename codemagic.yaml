definitions:
  instance: &instance
    # Sin instance_type: Codemagic asigna la máquina que permita el plan de la cuenta.
    # Para fijarla, añadir aquí linux_x2, mac_mini_m2 o windows_x2 según disponibilidad.
    max_build_duration: 60

  # Variables sensibles: se definen en Codemagic > Environment variables,
  # dentro del grupo `cinemx_secrets`, marcadas como "Secure".
  #   TMDB_READ_TOKEN, SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_WEB_CLIENT_ID
  env_secrets: &env_secrets
    groups:
      - cinemx_secrets
    java: 17
    vars:
      # Debe coincidir con gradle/wrapper/gradle-wrapper.properties.
      GRADLE_VERSION: 8.11.1

  scripts:
    - &ensure_wrapper
      name: Asegurar el Gradle wrapper
      # El wrapper incluye un .jar binario que no conviene versionar a mano.
      # Si el repo no lo trae, se genera aquí: primero con el Gradle de la imagen
      # y, si no hubiera, descargando la distribución oficial. Así el build no
      # depende de que la máquina venga con Gradle preinstalado.
      script: |
        set -e
        cd "$CM_BUILD_DIR"

        if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "Wrapper ya presente en el repositorio."
          exit 0
        fi

        if command -v gradle >/dev/null 2>&1; then
          echo "Generando el wrapper con el Gradle de la imagen ($(gradle --version | awk '/^Gradle/{print $2}'))."
          gradle wrapper --gradle-version "$GRADLE_VERSION"
        else
          echo "Sin Gradle en la imagen: descargando la distribución $GRADLE_VERSION."
          curl -sSLo /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp
          "/tmp/gradle-$GRADLE_VERSION/bin/gradle" wrapper --gradle-version "$GRADLE_VERSION"
        fi

        chmod +x gradlew
        ./gradlew --version

    - &write_secrets
      name: Generar secrets.properties
      script: |
        cat > "$CM_BUILD_DIR/secrets.properties" <<EOF
        TMDB_READ_TOKEN=$TMDB_READ_TOKEN
        SUPABASE_URL=$SUPABASE_URL
        SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
        GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
        EOF

    - &quality
      name: Calidad estática
      # En modo aviso (por defecto) reporta sin romper el build, para que el primer
      # pipeline llegue a compilar. Con el build ya verde: -PqualityAdvisory=false.
      script: ./gradlew ktlintCheck detekt

    - &unit_tests
      name: Tests unitarios
      script: ./gradlew testDebugUnitTest

workflows:
  debug:
    name: Debug (PR y ramas)
    <<: *instance
    environment:
      <<: *env_secrets
    triggering:
      events:
        - push
        - pull_request
    scripts:
      - *ensure_wrapper
      - *write_secrets
      - *quality
      - *unit_tests
      - name: APK debug
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/reports/**
      - app/build/test-results/**/*.xml

  release:
    name: Release firmado
    <<: *instance
    environment:
      <<: *env_secrets
      android_signing:
        # Keystore subido en Codemagic > Code signing identities con esta referencia.
        - cinemx_keystore
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - *ensure_wrapper
      - *write_secrets
      - *quality
      - *unit_tests
      - name: APK release firmado
        # Codemagic inyecta el keystore y exporta CM_KEYSTORE_PATH y compañía;
        # se traducen al keystore.properties que espera app/build.gradle.kts.
        script: |
          cat > "$CM_BUILD_DIR/keystore.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
          ./gradlew assembleRelease

      - name: Huella SHA-1 de la firma
        # Esta huella debe registrarse como cliente OAuth de Android en Google Cloud,
        # o Credential Manager no entregara el ID token al iniciar sesion con Google.
        script: |
          keytool -list -v -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" | grep -E "Alias name|SHA1:|SHA-1:"
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - a.mont.24.777@gmail.com
        notify:
          success: true
          failure: true

  # Workflow temporal: se lanza a mano una sola vez para crear el keystore de
  # release sin necesidad de un JDK local. El .keystore sale como artefacto y la
  # contrasena se imprime en el log; ambos se cargan luego en Codemagic, en
  # Code signing identities, con la referencia cinemx_keystore. Borrar tras usarlo.
  keystore:
    name: Generar keystore de release (temporal)
    <<: *instance
    scripts:
      - name: Crear keystore e imprimir huella
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | cut -c1-24)

          keytool -genkeypair -v \
            -keystore cinemx-release.keystore \
            -alias cinemx \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=CineMX, OU=Mobile, O=CineMX, L=CDMX, ST=CDMX, C=MX"

          echo "=================================================="
          echo "  KEYSTORE PASSWORD : $PASS"
          echo "  KEY PASSWORD      : $PASS"
          echo "  KEY ALIAS         : cinemx"
          echo "=================================================="
          keytool -list -v -keystore cinemx-release.keystore -storepass "$PASS" | grep -E "SHA1:|SHA-1:"
    artifacts:
      - cinemx-release.keystore
