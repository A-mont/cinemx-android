name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El repositorio no versiona el wrapper (el .jar se genera en Codemagic),
      # asi que aqui se instala Gradle standalone y se invoca `gradle`, no ./gradlew.
      # La version debe coincidir con gradle/wrapper/gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generar secrets.properties
        run: |
          cat > secrets.properties <<EOF
          TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          EOF

      - name: Calidad estática
        run: gradle ktlintCheck detekt

      - name: Tests unitarios
        run: gradle testDebugUnitTest

      - name: APK debug
        run: gradle assembleDebug

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
